# Source review is distinct from a Xenora test run.
#
# Evidence classes (derived from existing usage; claim classes are unchanged):
# A — Executed measurement on a named Apple Silicon host, with an independent
#     CPU/reference expectation. Valid only for the named host/software versions;
#     implementer-run unless independently reproduced. Never Xbox verification.
# B — Source-derived semantics from a public vendor specification, scoped to the
#     documented target (e.g. desktop RDNA 2, public D3D12, Metal/MSL). May be
#     exercised by synthetic tests, but does not establish console applicability.
# D — Public documentation or sample-source inspection (Microsoft/Xbox/Apple),
#     without console execution. Establishes only what the reviewed source states.
# E — Public tool/format documentation or observed behavior of a public
#     software tool (e.g. LLVM's gfx1030 documentation, or its assembler/
#     disassembler accepting gfx1030 forms), scoped to the pinned tool version.
#     Documentation review and execution are distinct; the claim's test field
#     records which one applies.
# U — Unknown/unestablished by the reviewed public sources: a bounded statement
#     about the evidence reviewed, not proof that no authorized source exists.
#
# Use B for semantics from a specification, D for a claim about what a public
# document or sample says, and E for a claim about a tool or its format support.
# The current registry does not assign class C.
#
# These are the repository's evidence classes. AGENTS.md §5 refers to this
# file and does not define a second vocabulary; the longer VERIFIED /
# REPRODUCED / SOURCE-DERIVED / ... vocabulary named in issue #549 is not
# present in the in-tree AGENTS.md, so no mapping is invented here.
schema_version = 1

[[claim]]
id = "CLAIM-XBOX-GDK-ACCESS"
class = "D"
claim = "Microsoft distinguishes Xbox Extensions from the public GDK, and the GDK Xbox graphics documentation topic requires NDA-program authorization."
sources = [
    "https://github.com/microsoft/GDK/blob/d773744074fb757ef27b2356c9aef5497b14623b/README.MD",
    "https://learn.microsoft.com/en-us/gaming/gdk/docs/features/graphics/gc-graphics-toc?view=gdk-2610",
]
retrieved = "2026-11-22"
architecture = "Microsoft GDK and Xbox Series X|S development"
test = "Read the public GDK README and the public graphics topic access notice."
uncertainty = "The restricted documentation was not accessed."

